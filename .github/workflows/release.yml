name: Release

# Publishing is triggered by the version file changing on main, which only a
# merged pull request can do. The gem goes to rubygems.org by trusted
# publishing: rubygems.org trades this workflow's OIDC token for a push key
# that lasts minutes, so no API key is stored in the repository.
on:
  push:
    branches: [main]
    paths:
      - "lib/trackberry/airports/version.rb"
  # A release that failed on something unrelated should not need a fake
  # version bump to retry.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # The suite runs again here rather than trusting the pull request's run,
      # because what ships is this commit, not the one that was reviewed.
      - run: bundle exec rake

      - name: Read the version being released
        id: version
        run: echo "value=$(ruby -Ilib -rtrackberry/airports/version -e 'print Trackberry::Airports::VERSION')" >> "$GITHUB_OUTPUT"

      # Pinned to a commit, as rubygems/release-gem pins it: this step holds
      # the push key.
      - name: Get a push key from rubygems.org
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to rubygems.org
        run: |
          gem build trackberry-airports.gemspec
          gem push "trackberry-airports-${{ steps.version.outputs.value }}.gem"

      # The notes are the changelog entry, so the release page and the
      # changelog cannot drift apart.
      - name: Tag the release and write its notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          notes=$(ruby -e '
            changelog = File.read("CHANGELOG.md")
            print changelog[/^## #{Regexp.escape(ENV.fetch("VERSION"))}.*?(?=\n## |\z)/m].to_s.strip
          ')
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "${notes}"
